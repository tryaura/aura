name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag can point at any commit, so releases re-run the full verify chain rather than trusting
  # that the commit went through pull-request CI. Mirrors both jobs in ci.yml, including the
  # clean-room packaging check that pull requests skip.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: pnpm run verify
      - name: Verify release packages
        run: pnpm verify:packages

  # Each target builds on its own runner rather than cross-compiling, so the smoke suite
  # exercises the binary on the platform it ships to.
  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-latest
          - target: darwin-x64
            runner: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Read back on purpose: `pnpm --filter` exits 0 when it matches no project, so a renamed
      # package would leave the manifest at its repo version and ship a tarball whose binary reports
      # something other than the tag it is named after.
      - name: Stamp release version
        env:
          AURA_TAG: ${{ github.ref_name }}
        run: |
          version="${AURA_TAG#v}"
          pnpm --filter @tryaura/aura pkg set "version=${version}"
          stamped="$(node -p "require('./distros/aura/package.json').version")"
          if [ "${stamped}" != "${version}" ]; then
            echo "::error::Version stamp did not apply: expected ${version}, manifest reports ${stamped}"
            exit 1
          fi
          echo "AURA_EXPECTED_VERSION=${version}" >> "${GITHUB_ENV}"
      # The smoke suite compares the binary against AURA_EXPECTED_VERSION rather than the manifest it
      # was compiled from, so the tag is what the artifact is held to.
      - name: Compile and smoke test binary
        run: pnpm run verify:binary
      # Apache-2.0 §4 requires the license text to travel with every redistribution, so the
      # tarball carries it next to the binary.
      - name: Package
        run: |
          cp LICENSE distros/aura/dist/LICENSE
          tar -czf "aura-${{ matrix.target }}.tar.gz" -C distros/aura/dist aura LICENSE
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aura-${{ matrix.target }}
          path: aura-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      # The install script refuses to install anything absent from this file.
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum aura-*.tar.gz > SHA256SUMS
      # A published release is immutable, so its assets cannot be corrected in place. The set is
      # checked here, before publication, rather than discovered by an updater that finds two
      # assets for one target and refuses every release until the next tag.
      - name: Verify the artifact set
        working-directory: artifacts
        run: |
          expected="SHA256SUMS
          aura-darwin-arm64.tar.gz
          aura-darwin-x64.tar.gz
          aura-linux-arm64.tar.gz
          aura-linux-x64.tar.gz"
          actual="$(ls -1 | LC_ALL=C sort)"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::Unexpected release artifacts."
            echo "expected:"; echo "${expected}"
            echo "actual:"; echo "${actual}"
            exit 1
          fi
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/aura-*.tar.gz
            artifacts/SHA256SUMS
      # Draft first, publish last. Publication is what freezes the tag and its assets, so every
      # check that could fail has to happen while the release can still be thrown away.
      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          files: |
            artifacts/aura-*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
      # Read back from the API rather than trusting the upload step: an asset that failed to
      # attach is the case the updater sees as a release missing its target.
      - name: Confirm the draft carries every asset
        env:
          AURA_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          attached="$(gh release view "${AURA_TAG}" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          expected="$(cd artifacts && ls -1 | LC_ALL=C sort)"
          if [ "${attached}" != "${expected}" ]; then
            echo "::error::Draft release assets do not match the built artifacts."
            echo "attached:"; echo "${attached}"
            exit 1
          fi
      - name: Publish release
        env:
          AURA_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${AURA_TAG}" --draft=false
      # The updater installs a release only when the API reports it immutable, so a release that
      # is not fails here rather than silently never reaching anyone's binary. Enable
      # Settings -> General -> Immutable releases if this step is what failed.
      - name: Assert the published release is immutable
        env:
          AURA_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${AURA_TAG}" --jq '.immutable')"
          if [ "${immutable}" != "true" ]; then
            echo "::error::Release ${AURA_TAG} is not immutable, so automatic updates will refuse it."
            exit 1
          fi
      # Every asset the updater verifies against must carry a SHA-256 digest of its own; the
      # published SHA256SUMS file is for the install script and manual verification, not for this.
      - name: Assert every archive exposes a SHA-256 digest
        env:
          AURA_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          missing="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${AURA_TAG}" \
            --jq '.assets[] | select(.name | endswith(".tar.gz")) | select((.digest // "") | startswith("sha256:") | not) | .name')"
          if [ -n "${missing}" ]; then
            echo "::error::Release assets without a SHA-256 digest: ${missing}"
            exit 1
          fi

  # The registry authenticates this job by its OIDC identity, so there is no npm token anywhere in
  # the repository. Each package names this workflow as its trusted publisher on npmjs.com; a run
  # from any other workflow or repository cannot mint a credential for them.
  publish-npm:
    name: Publish npm packages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token npm exchanges for a short-lived publish credential. Without it the
      # publish falls back to looking for a token and fails.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing landed in npm 11.5.1, which is newer than the npm bundled with some Node
      # 24 releases. Pinning the floor here keeps the job from silently reverting to token auth.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install --global npm@latest
          npm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      # The trio ships in lockstep off the SDK manifest, and the tag is what consumers will ask for.
      # Publishing is irreversible per version, so a tag that disagrees with the manifest stops the
      # job rather than burning a version number on the wrong contents.
      - name: Assert tag matches package version
        env:
          AURA_TAG: ${{ github.ref_name }}
        run: |
          tag="${AURA_TAG#v}"
          manifest="$(node -p "require('./packages/sdk/package.json').version")"
          if [ "${tag}" != "${manifest}" ]; then
            echo "::error::Tag ${AURA_TAG} does not match the published version ${manifest}"
            exit 1
          fi
      # pnpm packs rather than publishes because it is what rewrites `workspace:*` into the real
      # version range; npm then does the publishing because it is what performs the OIDC exchange.
      - name: Pack packages
        run: |
          mkdir -p dist-npm
          pnpm --filter @tryaura/aura-sdk --filter @tryaura/aura-cli --filter @tryaura/aura-testkit \
            pack --pack-destination dist-npm
      # Dependency order: a consumer that installs the CLI the moment it appears should already be
      # able to resolve the SDK version its manifest pins.
      #
      # The `./` is load-bearing: npm reads a bare `dir/file.tgz` as the `user/repo` git shorthand
      # and tries to clone it, so the publish fails before it ever reaches the registry.
      - name: Publish to npm
        run: |
          for package in tryaura-aura-sdk tryaura-aura-cli tryaura-aura-testkit; do
            npm publish ./dist-npm/"${package}"-*.tgz --access public --provenance
          done
