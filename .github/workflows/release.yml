name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Each target builds on its own runner rather than cross-compiling, so the smoke suite
  # exercises the binary on the platform it ships to. See AURA-12.
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-latest
          - target: darwin-x64
            runner: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Read back on purpose: `pnpm --filter` exits 0 when it matches no project, so a renamed
      # package would leave the manifest at its repo version and ship a tarball whose binary reports
      # something other than the tag it is named after.
      - name: Stamp release version
        env:
          AURA_TAG: ${{ github.ref_name }}
        run: |
          version="${AURA_TAG#v}"
          pnpm --filter @tryaura/aura pkg set "version=${version}"
          stamped="$(node -p "require('./distros/aura/package.json').version")"
          if [ "${stamped}" != "${version}" ]; then
            echo "::error::Version stamp did not apply: expected ${version}, manifest reports ${stamped}"
            exit 1
          fi
          echo "AURA_EXPECTED_VERSION=${version}" >> "${GITHUB_ENV}"
      # The smoke suite compares the binary against AURA_EXPECTED_VERSION rather than the manifest it
      # was compiled from, so the tag is what the artifact is held to.
      - name: Compile and smoke test binary
        run: pnpm run verify:binary
      - name: Package
        run: tar -czf "aura-${{ matrix.target }}.tar.gz" -C distros/aura/dist aura
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-${{ matrix.target }}
          path: aura-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # The install script refuses to install anything absent from this file.
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum aura-*.tar.gz > SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/aura-*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
