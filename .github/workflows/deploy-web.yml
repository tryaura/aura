name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
  # A preview URL is only worth publishing when the pull request changes the site itself — its
  # pages, docs content, or its own deploy definition. The root lockfile is deliberately absent:
  # it moves on every dependency change anywhere in the monorepo, and a lockfile-only regression
  # to the site build is already caught by `pnpm build` in the CI `Checks` job, which runs on
  # every pull request.
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-web.yml"
  # `versions upload` cannot create a Worker, so `aura-web` has to exist before pull request
  # previews work at all. Running this workflow by hand performs that first real deploy.
  workflow_dispatch:

# Never let two deploys race; the newer commit wins.
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'Preview' || 'Deploy' }}
    runs-on: ubuntu-latest
    # Lifted to the job env so the deploy step can test whether the credentials exist: the
    # `secrets` context is not available in `if:` conditions, but `env` is.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site
        run: pnpm --filter @tryaura/web build
      # `versions upload` publishes to a preview URL without touching production.
      # Skipped when the credentials are absent — on fork pull requests, and on any repository
      # where the secrets are unset. The build above still gates every pull request.
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: ${{ github.event_name == 'pull_request' && 'versions upload' || 'deploy' }}
      - name: Report skipped deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Cloudflare deploy skipped — CLOUDFLARE_API_TOKEN is not set for this repository."
