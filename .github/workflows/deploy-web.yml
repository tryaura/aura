name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
  # `versions upload` cannot create a Worker, so `aura-web` has to exist before pull request
  # previews work at all. Running this workflow by hand performs that first real deploy.
  workflow_dispatch:

# Never let two deploys race; the newer commit wins.
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'Preview' || 'Deploy' }}
    runs-on: ubuntu-latest
    # Lifted to the job env so the deploy step can test whether the credentials exist: the
    # `secrets` context is not available in `if:` conditions, but `env` is.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site
        run: pnpm --filter @tryaura/web build
      # A pull request preview uploads a version of an existing Worker; it cannot create one.
      # Until the first deploy has happened, previews are skipped rather than failed.
      - name: Check whether the Worker exists
        id: worker
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'pull_request'
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/aura-web")
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            # Anything else (401/403 on a mis-scoped token) must not masquerade as "not deployed
            # yet", or previews would silently never run again.
            *) echo "::error::Unexpected HTTP $status from the Workers API while looking up aura-web."; exit 1 ;;
          esac
      # `versions upload` publishes to a preview URL without touching production.
      # Skipped when the credentials are absent — on fork pull requests, and on any repository
      # where the secrets are unset. The build above still gates every pull request.
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && (github.event_name != 'pull_request' || steps.worker.outputs.exists == 'true')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: ${{ github.event_name == 'pull_request' && 'versions upload' || 'deploy' }}
      - name: Report skipped deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Cloudflare deploy skipped — CLOUDFLARE_API_TOKEN is not set for this repository."
      - name: Report skipped preview
        if: env.CLOUDFLARE_API_TOKEN != '' && steps.worker.outputs.exists == 'false'
        run: echo "::notice::Preview skipped — the aura-web Worker does not exist yet. Run this workflow via workflow_dispatch to create it, after which previews run automatically."
