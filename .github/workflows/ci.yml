name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Never verify the same ref twice at once; the newer commit wins.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs on pull requests too. This used to be skipped there on the reasoning that only a packaging
  # change could regress it, but the example distribution is exercised end to end here: #76 added a
  # preset requiring an MCP catalog entry, which made a non-interactive `setup --dry-run` stop on
  # the unmet requirement, and the break reached main green because this was the job that would
  # have caught it. Anything the example's smoke run covers can regress it, not just packaging.
  packages:
    name: Release packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release packages and example distribution
        run: pnpm verify:packages

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify
        env:
          # On a push to main, `github.event.before` is the previous tip — the same base the
          # pull request was audited against.
          FALLOW_AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: pnpm run verify
