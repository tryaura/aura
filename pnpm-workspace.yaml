packages:
  - apps/*
  - packages/*
  - plugins/*
  - distros/*
  # Reference distributions. They are workspace members so `pnpm typecheck` covers them on every
  # pull request; release verification re-resolves them against packed tarballs in a clean room.
  - examples/*
# Build scripts for the web app's toolchain: esbuild backs the Astro build, sharp backs
# image optimization, and workerd is the local Workers runtime used by `wrangler dev`.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
